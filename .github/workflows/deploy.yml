name: Deploy to GitHub Pages

on:
  push:
    branches:
      - "codespace-super-duper-spork-qv7qg7p4gjxx24pw6"

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments; if a new push comes in while a deployment
# is in progress, wait for the running deployment to finish before starting
# the next one (cancel-in-progress: false keeps the in-flight deploy alive).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
