<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Water Quest</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <h1>Water Quest</h1>
    <p class="game-instructions" id="game-instructions">Collect water jugs before time runs out. Turn on obstacles for an extra challenge.</p>
    <div class="stats">
      <p>Cans Collected: <span id="current-cans">0</span></p>
      <p>Time Left: <span id="timer">30</span>s</p>
      <p>Goal: <span id="goal-cans">15</span></p>
    </div>
    <label class="difficulty-select" for="difficulty-level">
      Difficulty
      <select id="difficulty-level">
        <option value="easy">Easy</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard</option>
      </select>
    </label>
    <label class="challenge-toggle" for="obstacles-enabled">
      <input type="checkbox" id="obstacles-enabled">
      Enable obstacle mode
    </label>
    <div id="achievements" class="achievement"></div>
    <div class="game-grid"></div>
    <div class="controls">
      <button id="start-game">Start Game</button>
      <button id="reset-game" type="button">Reset</button>
    </div>
    <footer class="charity-footer">
      <p>Learn more and support clean water projects:</p>
      <a href="https://www.charitywater.org/" target="_blank" rel="noopener noreferrer">charity: water website</a>
      <a href="https://www.charitywater.org/donate" target="_blank" rel="noopener noreferrer">Donate now</a>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
